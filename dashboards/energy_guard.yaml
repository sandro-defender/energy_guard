# =============================================================================
# Energy Guard - dashboard
# =============================================================================
# A read-only dashboard for the Energy Guard integration.
#
# It shows what Energy Guard is doing (status, last anomaly, blocked false
# energy, suspicious statistics offsets) and how to start the *read-only* scan.
# It never repairs, calibrates or deletes anything: every data-changing action
# still happens through an explicit, confirmation-gated service call that you
# run yourself (see docs/DASHBOARD.md and docs/SERVICES.md).
#
# ---------------------------------------------------------------------------
# How to use it (pick one)
# ---------------------------------------------------------------------------
# A) Copy and paste - no YAML configuration, works with HACS
#    1. Settings -> Dashboards -> Add dashboard -> New dashboard from scratch.
#    2. Give it a title, for example "Energy Guard", and create it.
#    3. Open it, click the pencil (Edit) icon, open the three dot menu and
#       choose "Raw configuration editor".
#    4. Delete the placeholder content and paste everything below the dashed
#       line that ends this header block.
#    5. Save. Done - the dashboard is now a normal UI dashboard you can edit.
#
# B) YAML mode
#    1. Copy this file to your Home Assistant config directory as
#       "energy_guard_dashboard.yaml".
#    2. Add the dashboard to configuration.yaml (a manual step - Energy Guard
#       never edits your configuration):
#         lovelace:
#           dashboards:
#             energy-guard:
#               mode: yaml
#               title: Energy Guard
#               icon: mdi:shield-check-outline
#               show_in_sidebar: true
#               filename: energy_guard_dashboard.yaml
#    3. Restart Home Assistant (or reload the Lovelace dashboards).
#
# ---------------------------------------------------------------------------
# Before you start
# ---------------------------------------------------------------------------
# * Home Assistant 2025.5.0 or newer (the same minimum as hacs.json).
# * Only core Home Assistant cards are used - no extra frontend resources.
# * The "Sources vs protected" view uses the example entities from the README
#   quick start (sensor.grid_import, sensor.grid_import_protected, ...).
#   Replace them with your own entity ids, or delete that view.
# * Every entity this dashboard references is either created by Energy Guard
#   itself (sensor.energy_guard_*, binary_sensor.energy_guard_data_issue) or
#   comes from the README example, so nothing here is required for the
#   integration to work.
# ---------------------------------------------------------------------------
title: Energy Guard
views:
  # ---------------------------------------------------------------------------
  # 1. Status: is Energy Guard protecting my data right now?
  # ---------------------------------------------------------------------------
  - title: Status
    path: energy-guard
    icon: mdi:shield-check-outline
    cards:
      - type: markdown
        title: Energy Guard
        content: |
          {% set issue = states('binary_sensor.energy_guard_data_issue') %}
          {% set issue_entity = 'binary_sensor.energy_guard_data_issue' %}
          {% set last = states('sensor.energy_guard_last_scan') %}
          {% if issue == 'on' %}
          ### Something needs your review

          {{ state_attr(issue_entity, 'action_required') or 'Open the Repair centre view for details.' }}

          * Blocked bad readings in the issue window: **{{ state_attr(issue_entity, 'blocked_events') or 0 }}**
          * Anomalies in the issue window: **{{ state_attr(issue_entity, 'anomaly_count') or 0 }}**
          * Suspicious statistics offsets: **{{ state_attr(issue_entity, 'statistics_issues') or 0 }}**
          * Estimated false energy: **{{ state_attr(issue_entity, 'estimated_false_energy') or 0 }} kWh**
          {% set affected = state_attr(issue_entity, 'affected_entities') or [] %}
          {% if affected %}
          * Affected: {% for entity in affected %}`{{ entity }}`{% if not loop.last %}, {% endif %}{% endfor %}
          {% endif %}
          {% elif issue == 'off' %}
          ### Everything is fine

          Energy Guard is publishing the protected values and no bad reading has
          reached the statistics. Nothing to do.

          {% if last not in ['unknown', 'unavailable', 'none'] %}
          Last statistics scan: {{ last | as_timestamp(default=0) | timestamp_custom('%Y-%m-%d %H:%M') }}
          {% else %}
          No statistics scan has run yet. Use the **Scan statistics** button on
          the *Repair centre* view to scan on demand.
          {% endif %}
          {% else %}
          ### Energy Guard is starting up

          The status sensor has no state yet. This is normal right after a Home
          Assistant restart; it resolves as soon as the first evaluation runs.
          {% endif %}

      - type: entities
        title: Live status
        state_color: true
        entities:
          - entity: binary_sensor.energy_guard_data_issue
            name: Data issue
          - entity: sensor.energy_guard_last_anomaly
            name: Last anomaly
          - entity: sensor.energy_guard_last_scan
            name: Last statistics scan
          - entity: sensor.energy_guard_anomalies
            name: Anomalies (issue window)
          - entity: sensor.energy_guard_estimated_false_energy
            name: Blocked false energy
          - entity: sensor.energy_guard_statistics_issues
            name: Suspicious statistics offsets

      - type: conditional
        conditions:
          - entity: binary_sensor.energy_guard_data_issue
            state: "on"
        card:
          type: markdown
          title: Open issue
          content: |
            {% set issue_entity = 'binary_sensor.energy_guard_data_issue' %}
            {% set last_event = state_attr(issue_entity, 'last_anomaly') %}
            {% if last_event %}
            **Last anomaly:** `{{ last_event.get('kind') }}` ({{ last_event.get('severity') }}) at
            {{ (last_event.get('timestamp') or '')[:16].replace('T', ' ') }}

            {{ last_event.get('message', '') }}
            {% else %}
            No anomaly event is recorded; the open issue comes from a suspicious
            statistics offset found by a scan.
            {% endif %}

            {% set simultaneous = state_attr(issue_entity, 'simultaneous_failures') or [] %}
            {% if simultaneous %}
            **{{ simultaneous | length }} simultaneous failure(s)**
            were observed - several sources failed at the same time, which usually
            points at the integration or the device, not at one single sensor.
            {% endif %}

            Read-only next step: open the **Repair centre** view.

      - type: entities
        title: Detection and scan settings in use
        entities:
          - type: attribute
            entity: sensor.energy_guard_statistics_issues
            attribute: lookback_hours
            name: Statistics lookback
            suffix: h
          - type: attribute
            entity: sensor.energy_guard_statistics_issues
            attribute: statistics_jump_threshold
            name: Suspicious jump threshold
            suffix: kWh
          - type: attribute
            entity: sensor.energy_guard_statistics_issues
            attribute: recorder_available
            name: Recorder available
          - type: attribute
            entity: sensor.energy_guard_statistics_issues
            attribute: last_scan_error
            name: Last scan error

  # ---------------------------------------------------------------------------
  # 2. Sources vs protected: the values Energy Guard actually publishes
  # ---------------------------------------------------------------------------
  - title: Sources vs protected
    path: energy-guard-sources
    icon: mdi:transmission-tower
    cards:
      - type: markdown
        content: |
          ### Example entities

          This view uses the quick-start example from the README
          (`sensor.grid_import` -> `sensor.grid_import_protected`, the derived
          `sensor.phase_total` / `sensor.not_measured_by_dp2` and the utility
          meter `sensor.grid_import_monthly`).

          **Replace these entity ids with your own, or delete this view.** The
          Home Assistant Energy Dashboard should always point at the
          `*_protected` entity, never at the raw source sensor.

      - type: entities
        title: Protected Energy Dashboard sources
        state_color: true
        entities:
          - entity: sensor.grid_import
            name: Grid import (raw source)
            secondary_info: last-changed
          - entity: sensor.grid_import_protected
            name: Grid import (protected)
            secondary_info: last-changed
          - entity: sensor.phase_a_protected
            name: Phase A (protected)
          - entity: sensor.phase_b_protected
            name: Phase B (protected)
          - entity: sensor.phase_total
            name: Phase total (derived sum)
          - entity: sensor.dp2_total
            name: DP2 total (raw source)
          - entity: sensor.not_measured_by_dp2
            name: Not measured by DP2 (derived difference)
          - entity: sensor.grid_import_monthly
            name: Grid import monthly (utility meter)

      - type: history-graph
        title: Source vs protected (last 48 hours)
        hours_to_show: 48
        entities:
          - entity: sensor.grid_import
            name: Grid import (raw)
          - entity: sensor.grid_import_protected
            name: Grid import (protected)

      - type: statistics-graph
        title: Long term statistics (12 months)
        chart_type: bar
        period: month
        days_to_show: 365
        stat_types:
          - change
        entities:
          - sensor.grid_import_protected
          - sensor.phase_total
          - sensor.not_measured_by_dp2

  # ---------------------------------------------------------------------------
  # 3. Repair centre: read-only entry points and the exact manual steps
  # ---------------------------------------------------------------------------
  - title: Repair centre
    path: energy-guard-repair
    icon: mdi:tools
    cards:
      - type: markdown
        content: |
          ### What happens, in order

          Energy Guard never repairs, calibrates or clears anything on its own:

          1. **Scan** - read-only, can be started from this dashboard.
          2. **Preview** - read-only, shows what a repair *would* change.
          3. **Confirm** - an explicit `confirm: true` in a service call you run
             yourself (Developer tools -> Actions).
          4. **Backup** - every affected statistic row is written to a JSON file
             before it is touched.
          5. **Verify and roll back** - the result is read back from the recorder
             and the backup file is named in the response.

          Monetary repairs are a **separate confirmation** (`confirm_cost: true`)
          and are never triggered implicitly by a kWh repair.

      - type: markdown
        content: |
          ### Scan (read-only)

          Pick a scope. All three are read-only; nothing is ever repaired by a
          scan. The scope of the last scan and the number of statistics it read
          are shown in the *Scan result* card below.

          * **My energy sensors** - the statistics Energy Guard manages
            (protected sources, derived sensors, utility meter sources, cost
            statistics). Fast, and the default.
          * **All energy statistics** - additionally scans every other energy
            statistic in the recorder (kWh, Wh, MWh, ...), including sensors
            Energy Guard does not manage. Use it after adding Energy Guard to an
            installation whose Energy Dashboard was already wrong.
          * **All statistics** - every cumulative statistic, whatever its unit
            (water, gas, ...).

          {% set scope = state_attr('sensor.energy_guard_statistics_issues', 'last_scan_scope') %}
          {% if scope %}
          Last scan: **{{ scope }}** over **{{ state_attr('sensor.energy_guard_statistics_issues', 'last_scan_statistic_count') }}** statistics.
          {% else %}
          No scan has run since the last restart.
          {% endif %}

      - type: horizontal-stack
        cards:
          - type: button
            name: My energy sensors
            icon: mdi:shield-search
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform-action: energy_guard.scan_statistics
              data:
                scope: linked
              confirmation:
                text: >-
                  Read-only scan of the statistics Energy Guard manages. Nothing
                  is modified.
          - type: button
            name: All energy statistics
            icon: mdi:lightning-bolt-circle
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform-action: energy_guard.scan_statistics
              data:
                scope: energy
              confirmation:
                text: >-
                  Read-only scan of EVERY energy statistic in the recorder,
                  including sensors Energy Guard does not manage. Nothing is
                  modified.
          - type: button
            name: All statistics
            icon: mdi:database-search
            icon_height: 40px
            show_state: false
            tap_action:
              action: perform-action
              perform-action: energy_guard.scan_statistics
              data:
                scope: all
              confirmation:
                text: >-
                  Read-only scan of EVERY cumulative statistic in the recorder.
                  Nothing is modified.

      - type: entities
        title: Scan result
        state_color: true
        entities:
          - entity: sensor.energy_guard_statistics_issues
            name: Suspicious offsets
          - type: attribute
            entity: sensor.energy_guard_statistics_issues
            attribute: last_scan
            name: Last scan
          - type: attribute
            entity: sensor.energy_guard_statistics_issues
            attribute: last_scan_scope
            name: Scope of the last scan
          - type: attribute
            entity: sensor.energy_guard_statistics_issues
            attribute: last_scan_statistic_count
            name: Statistics read
          - type: attribute
            entity: sensor.energy_guard_statistics_issues
            attribute: scan_scope
            name: Default scope (options)
          - type: attribute
            entity: sensor.energy_guard_statistics_issues
            attribute: repair_hint
            name: Repair hint
          - type: attribute
            entity: sensor.energy_guard_statistics_issues
            attribute: scan_warnings
            name: Scan warnings

      - type: markdown
        title: Suspicious offsets found by the last scan
        content: |
          {% set candidates = state_attr('sensor.energy_guard_statistics_issues', 'candidates') or [] %}
          {% if candidates %}
          | Statistic | Offset starts | Suggested offset | Estimated false energy | Evidence |
          | --- | --- | --- | --- | --- |
          {% for item in candidates %}
          | `{{ item.statistic_id }}` | {{ item.start_time[:16].replace('T', ' ') }} | {{ item.offset }} {{ item.unit }} | {{ item.estimated_false_energy }} kWh | {{ item.evidence | join(', ') }} |
          {% endfor %}

          Only the first 10 candidates are shown; the full list is in the scan
          response. Use the fingerprint of an entry when you call
          `energy_guard.repair_statistics` so a changed row cannot be repaired by
          mistake.
          {% else %}
          No suspicious statistics offsets. Either the data is fine, or the scan
          has not run yet (press the scan button above).
          {% endif %}

      - type: markdown
        title: Cost (monetary) repair suggestions
        content: |
          {% set suggestions = state_attr('sensor.energy_guard_statistics_issues', 'cost_repair_suggestions') or [] %}
          {% set cost = state_attr('sensor.energy_guard_statistics_issues', 'cost_repair') or {} %}
          {% if not cost.get('enabled', false) %}
          Cost repair is disabled in the integration options, so no monetary
          suggestion is calculated. Enable **Cost repair** in the Energy Guard
          options if you want the cost statistics mirrored.
          {% elif suggestions %}
          Price used: **{{ cost.get('effective_price') }} {{ cost.get('currency') }}/kWh**
          ({{ 'live price entity ' ~ cost.get('price_entity_id') if cost.get('price_entity_id') else 'fixed price' }}).

          | Cost statistic | Offset starts | Suggested offset | Worked example |
          | --- | --- | --- | --- |
          {% for item in suggestions %}
          | `{{ item.statistic_id }}` | {{ item.start_time[:16].replace('T', ' ') }} | {{ item.offset }} {{ item.unit }} | {{ item.worked_example }} |
          {% endfor %}

          A cost repair needs its own confirmation: `confirm: true` **and**
          `confirm_cost: true` in the same call.
          {% else %}
          Cost repair is enabled but the last scan produced no monetary
          suggestion (no linked cost statistic, or no candidate for it).
          {% endif %}

      - type: markdown
        title: Configuration
        content: |
          Everything Energy Guard can be configured with - protected, derived and
          meter sensors, detection thresholds, the statistics scanner, the tariff,
          backups - lives on its own page:

          **[Open the Energy Guard configuration page](/energy-guard-config)**

          The page is part of the integration (no YAML, admin only) and contains
          the same nine sections as the options flow, plus the repair workflow.
          If the entry is missing from the sidebar, open the link above or

          **Settings -> Devices & Services -> Energy Guard -> Configure**.

          {% set scope = state_attr('sensor.energy_guard_statistics_issues', 'scan_scope') %}
          {% set last_scope = state_attr('sensor.energy_guard_statistics_issues', 'last_scan_scope') %}
          * Default scan scope: **{{ scope or 'linked' }}**
          * Scope of the last scan: **{{ last_scope or 'none yet' }}**

      - type: markdown
        title: How to actually repair (manual, by design)
        content: |
          ### 1. Preview a repair (changes nothing)

          ```yaml
          action: energy_guard.repair_statistics
          data:
            repairs:
              - statistic_id: sensor.grid_import_protected
            dry_run: true
          ```

          ### 2. Repair after you reviewed the preview

          ```yaml
          action: energy_guard.repair_statistics
          data:
            repairs:
              - statistic_id: sensor.grid_import_protected
            confirm: true
            create_backup: true
            verify: true
          ```

          ### 3. Repair the matching cost statistic (separate confirmation)

          ```yaml
          action: energy_guard.repair_statistics
          data:
            cost_repairs:
              - statistic_id: sensor.grid_import_protected_cost
            confirm: true
            confirm_cost: true
            create_backup: true
          ```

          ### 4. Calibrate a utility meter (preview first, then confirm)

          ```yaml
          action: energy_guard.calibrate_utility_meter
          data:
            entity_id: sensor.grid_import_monthly
            confirm: false
          ```

          ### 5. Clear statistics (last resort, needs its own confirmation)

          ```yaml
          action: energy_guard.clear_statistics
          data:
            statistic_ids:
              - sensor.grid_import_protected
            confirm: true
            create_backup: true
          ```

          ### 6. Export a repair report (read-only, writes one file)

          ```yaml
          action: energy_guard.export_repair_report
          data:
            name: after-grid-import-repair
            hours: 168
          ```

          The report lands in `config/energy_guard/reports` and contains the
          candidates, the repairs you applied and the recommended next steps -
          useful as an audit trail. `energy_guard.export_templates` does the same
          for the generated YAML templates.

          Every response names the backup file that was written. Restore from it
          if the result is not what you expected - see docs/SAFETY.md and
          docs/STATISTICS-REPAIR.md.
