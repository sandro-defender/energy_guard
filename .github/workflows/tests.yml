# Continuous integration for Energy Guard.
#
# Runs on every push to main and every pull request:
#
# * "tests"    - ruff (lint + format) and the full pytest suite at both ends
#                of the supported Home Assistant range: the newest release the
#                pinned harness follows (Python 3.14, requirements_test.txt)
#                and the oldest release hacs.json claims - 2025.5.0, Python
#                3.13, requirements_test_min.txt. The JS smoke test runs too:
#                ubuntu-latest runners ship with Node. Coverage is measured on
#                the newest-HA job and must stay above the fail-under floor
#                declared in pyproject.toml; the result is printed in the job
#                summary.
# * "hassfest" - Home Assistant's own integration validator.
# * "hacs"     - HACS repository/manifest validation.
#
# The suite is the source of truth (see docs/DEVELOPMENT.md): a change that is
# not covered by a test is not ready, and a red job must block a merge.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per end of the supported range. The newest Home Assistant
        # (requirements_test.txt) requires Python 3.14 at runtime (see
        # docs/DEVELOPMENT.md); the declared minimum 2025.5.0 runs on 3.13
        # with the matching pinned harness (requirements_test_min.txt), which
        # is what proves the compatibility claim hacs.json makes to HACS
        # users. Coverage is enforced on the newest-HA job only: it is the
        # authoritative measurement (the floor lives in pyproject.toml).
        include:
          - name: "HA 2026.9 (newest)"
            python-version: "3.14"
            requirements: requirements_test.txt
            coverage: true
          - name: "HA 2025.5 (declared minimum)"
            python-version: "3.13"
            requirements: requirements_test_min.txt
            coverage: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }} .venv


      - name: Install test dependencies
        run: |
          set -o pipefail
          uv pip install --python .venv/bin/python \
              -r ${{ matrix.requirements }} ruff 2>&1 | tee install.log

      - name: Ruff lint
        run: .venv/bin/ruff check .

      - name: Ruff format
        run: .venv/bin/ruff format --check .

      - name: Run tests with coverage
        if: matrix.coverage
        run: |
          set -o pipefail
          .venv/bin/python -m pytest tests/ -q -ra --log-cli-level=CRITICAL \
              --cov --cov-report=term-missing --cov-report=json \
              2>&1 | tee pytest.log

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: |
          set -o pipefail
          .venv/bin/python -m pytest tests/ -q -ra --log-cli-level=CRITICAL \
              2>&1 | tee pytest.log

      - name: Surface failures as annotations
        if: failure()
        run: |
          # Encode the tail of the most recent log into a single annotation
          # so the failure reason is visible without downloading the full
          # log (job summaries keep the same tail for later inspection).
          LOG=install.log
          [ -f pytest.log ] && LOG=pytest.log
          if [ ! -f "$LOG" ]; then
            echo "::error::${{ matrix.name }} failed before any log was written"
            exit 0
          fi
          ENCODED="$(tail -45 "$LOG" | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::error title=Failed (${{ matrix.name }}), tail of $LOG::$ENCODED"
          {
            echo "### Failure details (${{ matrix.name }})"
            echo ""
            echo '```'
            tail -60 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish coverage (job summary)
        if: ${{ always() && matrix.coverage }}
        run: |
          if [ ! -f coverage.json ]; then
            echo "Coverage report was not produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TOTAL="$(.venv/bin/python -c 'import json; print(json.load(open("coverage.json"))["totals"]["percent_covered_display"])')"
          echo "### Test coverage: ${TOTAL}%" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Measured over \`custom_components/energy_guard\` (see" >> "$GITHUB_STEP_SUMMARY"
          echo "\`[tool.coverage]\` in \`pyproject.toml\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          .venv/bin/python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Test coverage: ${TOTAL}%"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
