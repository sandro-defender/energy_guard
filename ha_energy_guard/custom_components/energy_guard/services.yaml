# Energy Guard services.
#
# Safety: every service that modifies data requires `confirm: true`, is admin
# only and returns a preview instead of changing anything when the confirmation
# is missing.

scan_statistics:
  name: Scan statistics
  description: >-
    Read-only scan of the recorder statistics for suspicious offsets. Returns the
    detected candidates with a suggested offset, the exact start time, the unit
    and a fingerprint. Never modifies data.
  fields:
    start_time:
      name: Start time
      description: Start of the period to scan (defaults to the configured lookback).
      required: false
      selector:
        datetime:
    end_time:
      name: End time
      description: End of the period to scan (defaults to now).
      required: false
      selector:
        datetime:
    statistic_ids:
      name: Statistic IDs
      description: >-
        Statistics to scan (for example sensor.grid_import). Defaults to the
        entities and sources managed by Energy Guard.
      required: false
      example: sensor.grid_import
      selector:
        text:
          multiple: true
    entity_ids:
      name: Entity IDs
      description: Same as statistic_ids, but using the entity picker.
      required: false
      selector:
        entity:
          domain: sensor
          multiple: true
    include_cost_suggestions:
      name: Include cost suggestions
      description: Also calculate the matching monetary correction for the cost statistic.
      required: false
      default: true
      selector:
        boolean:
    config_entry_id:
      name: Config entry
      description: Only act on this Energy Guard config entry (optional).
      required: false
      selector:
        text:

repair_statistics:
  name: Repair statistics
  description: >-
    Apply explicitly supplied, confirmed sum offsets with the recorder API. Writes
    a JSON backup of every affected statistic first and verifies the result after
    the recorder finished. Without confirm: true it only returns a preview and
    changes nothing.
  fields:
    repairs:
      name: Repairs
      description: >-
        List of offsets to apply. Each item needs statistic_id, start_time and
        offset (unit and the fingerprint from scan_statistics are optional).
      required: true
      example: >-
        [{"statistic_id": "sensor.grid_import", "start_time":
        "2026-09-01T10:00:00+00:00", "offset": -38243.46, "unit": "kWh"}]
      selector:
        object:
    cost_repairs:
      name: Cost repairs
      description: >-
        Monetary corrections (for example GEL). These require their own
        confirmation through confirm_cost: true.
      required: false
      example: >-
        [{"statistic_id": "sensor.grid_import_cost", "start_time":
        "2026-09-01T10:00:00+00:00", "offset": -8987.21, "unit": "GEL"}]
      selector:
        object:
    confirm:
      name: Confirm
      description: >-
        Must be true to actually modify statistics. When false (default), the
        service returns a preview and changes nothing.
      required: false
      default: false
      selector:
        boolean:
    confirm_cost:
      name: Confirm cost repair
      description: >-
        Separate confirmation for monetary corrections. Without it, cost repairs
        are only returned as a preview.
      required: false
      default: false
      selector:
        boolean:
    dry_run:
      name: Dry run
      description: Force a preview even when confirm is true.
      required: false
      default: false
      selector:
        boolean:
    create_backup:
      name: Create backup
      description: Write a JSON backup of the affected rows before the repair.
      required: false
      default: true
      selector:
        boolean:
    verify:
      name: Verify
      description: >-
        Wait for the recorder queue and read the statistic back to verify the
        correction.
      required: false
      default: true
      selector:
        boolean:
    config_entry_id:
      name: Config entry
      description: Only act on this Energy Guard config entry (optional).
      required: false
      selector:
        text:

calibrate_utility_meter:
  name: Calibrate utility meter
  description: >-
    Calibrate a utility_meter entity to an exact value, either supplied directly
    or calculated from a protected cumulative source and a cycle-start baseline.
    Requires confirm: true; otherwise only a preview is returned.
  fields:
    entity_id:
      name: Utility meter entity
      description: The utility_meter sensor that should be calibrated.
      required: true
      example: sensor.monthly_grid_import
      selector:
        entity:
          domain: sensor
          integration: utility_meter
    value:
      name: Value
      description: Exact value the meter should be set to.
      required: false
      example: 412.55
      selector:
        number:
          min: 0
          mode: box
    source_entity_id:
      name: Source entity
      description: >-
        Cumulative sensor used to calculate the value (usually a protected Energy
        Guard sensor).
      required: false
      example: sensor.grid_import_protected
      selector:
        entity:
          domain: sensor
    baseline_value:
      name: Baseline value
      description: Value of the source at the start of the current cycle.
      required: false
      example: 1200.0
      selector:
        number:
          min: 0
          mode: box
    cycle_start:
      name: Cycle start
      description: >-
        Timestamp of the cycle start. When given, the baseline is read from the
        recorder history of the source entity.
      required: false
      selector:
        datetime:
    cycle:
      name: Cycle
      description: Utility meter cycle name (informational, shown in the result).
      required: false
      example: monthly
      selector:
        text:
    confirm:
      name: Confirm
      description: Must be true to actually call utility_meter.calibrate.
      required: false
      default: false
      selector:
        boolean:
    dry_run:
      name: Dry run
      description: Force a preview even when confirm is true.
      required: false
      default: false
      selector:
        boolean:
    config_entry_id:
      name: Config entry
      description: Only act on this Energy Guard config entry (optional).
      required: false
      selector:
        text:

clear_statistics:
  name: Clear statistics
  description: >-
    Delete the long term statistics of exactly the supplied statistic ids.
    Requires confirm: true, writes a backup first and never touches any other
    sensor.
  fields:
    statistic_ids:
      name: Statistic IDs
      description: Statistics to clear (only these are affected).
      required: true
      example: sensor.broken_meter
      selector:
        text:
          multiple: true
    confirm:
      name: Confirm
      description: Must be true, otherwise a preview is returned and nothing is deleted.
      required: false
      default: false
      selector:
        boolean:
    create_backup:
      name: Create backup
      description: Write a JSON backup of the rows before deleting them.
      required: false
      default: true
      selector:
        boolean:
    config_entry_id:
      name: Config entry
      description: Only act on this Energy Guard config entry (optional).
      required: false
      selector:
        text:

export_repair_report:
  name: Export repair report
  description: >-
    Write a JSON and a Markdown report with the detected anomalies, backups,
    repairs and calibrations of the last period. Read-only.
  fields:
    name:
      name: File name
      description: Base name of the report files.
      required: false
      default: energy_guard_report
      selector:
        text:
    hours:
      name: Hours
      description: How far back the report should look.
      required: false
      default: 168
      selector:
        number:
          min: 1
          max: 8760
          mode: box
    config_entry_id:
      name: Config entry
      description: Only act on this Energy Guard config entry (optional).
      required: false
      selector:
        text:

export_templates:
  name: Export templates
  description: >-
    Return YAML with template sensors that mirror the Energy Guard protected
    sensors, for users who prefer plain templates. Energy Guard never writes to
    your configuration files unless write_file is true (it then writes to its own
    folder).
  fields:
    write_file:
      name: Write file
      description: >-
        Also write the YAML to <config>/energy_guard/energy_guard_templates.yaml.
      required: false
      default: false
      selector:
        boolean:
    config_entry_id:
      name: Config entry
      description: Only act on this Energy Guard config entry (optional).
      required: false
      selector:
        text:
